# 慧盘 · Docker Compose
# 用法:
#   docker-compose up -d          # 启动定时守护 + 本地预览
#   docker-compose run scheduler python run_scheduler.py --run all    # 手动全量
#   docker-compose run scheduler python run_scheduler.py --run news   # 只跑新闻
#   docker-compose logs -f        # 查看日志
#   浏览器打开 http://localhost:8080

services:
  scheduler:
    build: .
    container_name: huipan-scheduler
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # JSON数据：容器写入，宿主机+Nginx可读
      - ./static/data:/app/static/data
      # DuckDB数据库
      - ./data:/app/data
      # 配置文件
      - ./config:/app/config
      # 日志
      - ./logs:/app/logs

  web:
    image: nginx:alpine
    container_name: huipan-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./static:/usr/share/nginx/html/static
      - ./config:/usr/share/nginx/html/config:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - scheduler
